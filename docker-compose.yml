services:
  postgres:
    image: postgres:16-alpine
    container_name: agentshield-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: agentshield-jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: agentshield-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/agentshield
      - OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - ADMIN_TOKEN=agentshield-admin-secret
      - DEFAULT_API_KEY=agentshield-dev-key-12345
    ports:
      - "8000:8000"

volumes:
  postgres_data:
